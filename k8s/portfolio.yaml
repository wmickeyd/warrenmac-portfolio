apiVersion: v1
kind: Namespace
metadata:
  name: portfolio
  labels:
    # Enforces Kubernetes Restricted Pod Security Standards
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-agent
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-agent
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio-agent
    app.kubernetes.io/part-of: warrenmac-portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-agent
    spec:
      serviceAccountName: portfolio-agent
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: warrenmac-portfolio:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GEMINI_MODEL
              value: "gemini-flash-lite-latest"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: apiKey
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Container-level hardening (Restricted PSS compliant)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-agent
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio-agent
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8090
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: portfolio-agent
---
# Zero-Trust Network Isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-portfolio-agent
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming HTTP traffic to port 8080
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # 1. Allow DNS resolution to CoreDNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow HTTPS outbound strictly for external LLM API calls (Gemini)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8       # Block VPC / private range
              - 172.16.0.0/12    # Block internal Docker range
              - 192.168.0.0/16   # Block internal K8s cluster range
      ports:
        - protocol: TCP
          port: 443
