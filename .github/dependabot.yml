# Keeps SHA-pinned actions, digest-pinned base images and Python dependencies current
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
