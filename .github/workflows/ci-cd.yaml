name: "AI DevSecOps Pipeline: Test, Scan & Sign"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write      # Required for Sigstore/Cosign keyless OIDC signing
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # 1. Adversarial & Functional Testing
  # =========================================================================
  adversarial-tests:
    name: "Adversarial & Guardrail Tests (Pytest)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

  # =========================================================================
  # 2. Trivy Filesystem, Secret & IaC Security Audit
  # =========================================================================
  security-audit:
    name: "Trivy Security Audit (Secrets & K8s PSS)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Secret & Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0" # Audit log for PRs

      - name: Trivy Kubernetes Configuration Audit (CIS & Restricted PSS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "k8s/"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

      - name: Trivy Terraform IaC Security Audit
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "terraform/"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  # =========================================================================
  # 3. Hardened Container Build, Image CVE Scan & Cosign Attestation
  # =========================================================================
  build-scan-sign:
    name: "Build, Scan Image & Sign (Cosign)"
    needs: [adversarial-tests, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }} # Load locally for PR image scan

      - name: Trivy Container Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          scan-type: "image"
          severity: "CRITICAL"
          format: "table"
          exit-code: "0" # Generates vulnerability report in CI

      # Cryptographic Container Signing with Sigstore Cosign
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image (Keyless OIDC)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          echo "Signing image with digest ${DIGEST} via GitHub OIDC..."
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

