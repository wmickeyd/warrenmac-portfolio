name: "AI DevSecOps Pipeline: Test, Scan, Sign & Deploy"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "terraform/**"
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "terraform/**"
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write      # Required for Sigstore/Cosign and Google Cloud Workload Identity Federation
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GCP_PROJECT_ID: "project-60b1ce90-88cb-4ae2-8b4"
  GKE_CLUSTER: "portfolio-cluster"
  GKE_REGION: "us-central1"
  K8S_NAMESPACE: "portfolio"
  K8S_DEPLOYMENT: "portfolio-agent"
  K8S_CONTAINER: "agent"
  WIF_PROVIDER: "projects/326942544071/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  WIF_SERVICE_ACCOUNT: "tf-runner-sa@project-60b1ce90-88cb-4ae2-8b4.iam.gserviceaccount.com"

jobs:
  # =========================================================================
  # 1. Adversarial & Functional Testing
  # =========================================================================
  adversarial-tests:
    name: "Adversarial & Guardrail Tests (Pytest)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

  # =========================================================================
  # 2. Trivy Security Audit (Secrets, Vulnerabilities & K8s PSS)
  # =========================================================================
  security-audit:
    name: "Trivy Security Audit (Secrets & K8s PSS)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Secret Detection Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "secret"
          format: "table"
          exit-code: "1" # Hard blocking gate: fail build immediately if any secret is leaked

      - name: Trivy Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "1" # Hard blocking gate: fail build if CRITICAL or HIGH CVEs exist

      - name: Trivy Kubernetes Configuration Audit (CIS & Restricted PSS)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "k8s/"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  # =========================================================================
  # 3. Hardened Container Build, Image CVE Scan & Cosign Attestation
  # =========================================================================
  build-scan-sign:
    name: "Build, Scan Image & Sign (Cosign)"
    needs: [adversarial-tests, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }} # Load locally for PR image scan

      - name: Trivy Container Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          scan-type: "image"
          severity: "CRITICAL"
          format: "table"
          exit-code: "0" # Generates vulnerability report in CI

      # Cryptographic Container Signing with Sigstore Cosign
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image (Keyless OIDC)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          echo "Signing image with digest ${DIGEST} via GitHub OIDC..."
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

  # =========================================================================
  # 4. Continuous Deployment: GKE Zero-Downtime Rollout
  # =========================================================================
  deploy-production:
    name: "Deploy to GKE (Production)"
    needs: [build-scan-sign]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Required for Workload Identity Federation OIDC token
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Apply Kubernetes Configurations & Roll Out Image
        run: |
          echo "Applying Kubernetes manifests in namespace ${{ env.K8S_NAMESPACE }}..."
          kubectl apply -f k8s/portfolio.yaml
          kubectl apply -f k8s/ingress.yaml

          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Updating deployment ${{ env.K8S_DEPLOYMENT }} container '${{ env.K8S_CONTAINER }}' to ${IMAGE_TAG}..."
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            ${{ env.K8S_CONTAINER }}=${IMAGE_TAG} \
            --namespace ${{ env.K8S_NAMESPACE }}

          echo "Awaiting zero-downtime rollout completion..."
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Verify Deployment Health & Endpoint Status
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app.kubernetes.io/name=${{ env.K8S_DEPLOYMENT }}
          echo "✔ Production deployment successfully verified!"
