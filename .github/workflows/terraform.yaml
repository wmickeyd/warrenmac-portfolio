name: "Terraform GitOps: Plan & Apply"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false # Never cancel Terraform execution mid-flight

permissions:
  contents: read
  id-token: write      # Required for Workload Identity Federation OIDC token
  pull-requests: write # Required to post speculative plan summaries to PRs

env:
  GCP_PROJECT_ID: "project-60b1ce90-88cb-4ae2-8b4"
  WIF_PROVIDER: "projects/326942544071/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  WIF_SERVICE_ACCOUNT: "tf-runner-sa@project-60b1ce90-88cb-4ae2-8b4.iam.gserviceaccount.com"
  TF_VERSION: "1.9.5"

jobs:
  terraform-audit:
    name: "Trivy IaC Security Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy Terraform IaC Security Audit
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "terraform/"
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"

  terraform:
    name: "Terraform Plan & Apply"
    needs: [terraform-audit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -var="project_id=${{ env.GCP_PROJECT_ID }}" -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post Terraform Plan to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = "";
            try {
              if (fs.existsSync('terraform/plan.txt')) {
                planOutput = fs.readFileSync('terraform/plan.txt', 'utf8');
              } else {
                planOutput = "No plan.txt output file found.";
              }
            } catch (err) {
              planOutput = "Failed to extract plan output: " + err.message;
            }
            if (planOutput.length > 60000) {
              planOutput = planOutput.substring(0, 60000) + "\n... (truncated for size limit)";
            }
            const output = `#### Terraform Plan Status: \`${{ steps.plan.outcome }}\`
            * **Format**: \`${{ steps.fmt.outcome }}\`
            * **Init**: \`${{ steps.init.outcome }}\`
            * **Validate**: \`${{ steps.validate.outcome }}\`

            <details><summary>Click to view Terraform Plan / Error Details</summary>

            \`\`\`terraform
            ${planOutput}
            \`\`\`

            </details>

            *Action executed by @${{ github.actor }} on \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Verify Plan Success
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan encountered an error:"
          cat plan.txt
          exit 1

      - name: Terraform Apply
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

